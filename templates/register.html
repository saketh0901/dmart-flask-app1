{% extends "base.html" %}
{% block title %}Register – DMart{% endblock %}
{% block content %}
<div class="container" style="max-width:480px;">
  <div class="card" style="margin-top:40px;">
    <h2 style="font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--green);margin-bottom:24px;text-align:center;">Create Account</h2>
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input class="form-control" type="text" name="username" required placeholder="John Doe"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" name="email" required placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" name="password" required placeholder="Min 6 characters"/>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input class="form-control" type="password" name="confirm_password" required placeholder="Repeat password"/>
      </div>
      <button class="btn btn-green" type="submit" style="width:100%;padding:12px;font-size:1rem;">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:18px;color:var(--mid);">
      Already registered? <a href="{{ url_for('login') }}" style="color:var(--green);font-weight:700;">Login</a>
    </p>
  </div>
</div>
{% endblock %}
