{% extends "base.html" %}
{% block title %}Login – DMart{% endblock %}
{% block content %}
<div class="container" style="max-width:440px;">
  <div class="card" style="margin-top:40px;">
    <h2 style="font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--green);margin-bottom:24px;text-align:center;">Welcome Back</h2>
    <form method="POST">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" name="email" required placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" name="password" required placeholder="••••••••"/>
      </div>
      <button class="btn btn-green" type="submit" style="width:100%;padding:12px;font-size:1rem;">Login</button>
    </form>
    <p style="text-align:center;margin-top:18px;color:var(--mid);">
      No account? <a href="{{ url_for('register') }}" style="color:var(--green);font-weight:700;">Register</a>
    </p>
  </div>
</div>
{% endblock %}
